baseURL = "https://pathkey.in/"
title = "Pathkey — AI advisory & automation for businesses"
languageCode = "en"
theme = "adritian-free-hugo-theme"
# No tags or categories are used, so their empty list pages are not built.
# (Must stay above the first [table], or TOML attaches it to that table.)
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 6

[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  footer = []

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"


# Content that only feeds other pages (homepage copy, footer, The Patkis testimonials and
# ventures, the unused case-studies section) is kept for templates but not published, so it
# can't show up in search as thin or duplicate pages.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "always"
  [cascade.target]
    path = "{/home,/home/**,/footer,/footer/**,/testimonial,/testimonial/**,/client-work,/client-work/**,/case-studies,/case-studies/**,/experience,/experience/**}"

# Blog posts redirect to LinkedIn and are marked noindex, so keep them out of the sitemap.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = "/blog/**"

## Base mounts
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"

