{{/* Cloudflare Web Analytics — only in production builds when token is configured */}}
{{ if and hugo.IsProduction .Site.Params.cloudflareAnalyticsToken }}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ .Site.Params.cloudflareAnalyticsToken }}"}'></script>
{{ end }}

<!-- Google Fonts: Fraunces (headlines) + Inter (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Email obfuscation: hide from crawlers, assemble for real users -->
<style>.pk-at { font-size: 0; }</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.pk-email').forEach(function(el) {
    var u = el.getAttribute('data-u');
    var d = el.getAttribute('data-d');
    if (u && d) {
      var addr = u + '@' + d;
      el.href = 'mailto:' + addr;
      el.textContent = addr;
    }
  });
});
</script>
