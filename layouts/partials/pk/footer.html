{{- /* Shared footer. Call with dict "page" . "home" <home.md params>. */ -}}
<footer><div class="wrap"><a class="brand" href="{{ if .page.IsHome }}#main{{ else }}{{ "/" | relURL }}{{ end }}" aria-label="Pathkey home"><img src="{{ "pk/img/pathkey-logo.png" | relURL }}" alt="Pathkey" width="875" height="295"></a><div class="footer-meta"><span>© {{ now.Year }} Pathkey.</span>{{ $here := .page.RelPermalink }}{{ range .home.footer_links }}<a href="{{ .url | relURL }}"{{ if eq (.url | relURL) $here }} aria-current="page"{{ end }}>{{ .name }}</a>{{ end }}</div><a class="footer-top" href="#main">Back to top <span aria-hidden="true">↑</span></a></div></footer>
